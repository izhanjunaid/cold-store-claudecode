# ColdChain — production stack for a single facility box (offline-capable LAN deploy).
#
# TWO ways to run the same compose file:
#   * Build locally (dev / first box):   docker compose --env-file .env.production up -d --build
#   * Pull pre-built images (CI rollout): set COLDCHAIN_TAG in .env.production, then
#                                         docker compose --env-file .env.production pull && up -d
#     (Images are published to GHCR by .github/workflows/release.yml on each `v*` tag;
#      scripts/update.sh does the pull + migrate + health-check + rollback automatically.)
#
# Access from any device on the facility LAN:
#   http://<box-ip>/    (single origin — Caddy routes /v1, /docs, /health to the API,
#                        everything else to the Next.js web app)
#
# Runs with NO internet (LAN only). Pair the box with a UPS and set Docker to start on boot.

name: coldchain

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port mapping: the app reaches Postgres over the compose network and backups
    # run via `docker compose exec postgres pg_dump`. This avoids clashing with any Postgres
    # already listening on the host's 5432 (e.g. a local dev install). To inspect the DB
    # from the host, temporarily add:  ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: applies pending Prisma migrations, then exits. Gates the API start.
  # Reuses the API image (it bundles the Prisma CLI, schema, and migrations), so the box
  # only ever pulls two app images.
  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/izhanjunaid}/coldchain-api:${COLDCHAIN_TAG:-latest}
    restart: "no"
    command: ["pnpm", "--filter", "@coldchain/db", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/izhanjunaid}/coldchain-api:${COLDCHAIN_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    logging: *default-logging
    init: true            # reap Chromium child processes spawned during PDF generation
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Least-privilege runtime role (F-2a): DML only, cannot run DDL or call
      # financial_guards_set() to disable the financial integrity triggers.
      # Created/updated idempotently by scripts/app-role.sql (installers and
      # update.sh run it). Only the one-shot `migrate` service above uses the
      # owner credentials.
      DATABASE_URL: postgresql://${APP_DB_USER:-coldchain_app}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Requests are same-origin behind Caddy, so CORS rarely fires; set to the public origin anyway.
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://coldchain.local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/izhanjunaid}/coldchain-web:${COLDCHAIN_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""   # same-origin; Caddy proxies /v1 to the API
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      # - "443:443"   # Phase C: enable HTTPS via Caddy's internal CA (see Caddyfile)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
