<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- ColdChain runs offline. The PDF templates request web fonts ('Noto Nastaliq
       Urdu' / 'Jameel Noori Nastaleeq') that we no longer fetch over the network.
       Map those family names to the locally-installed Urdu font so receipts render
       Urdu correctly with no internet access.
       To prefer a Nastaliq style instead of Naskh, install fonts-sil-awami-nastaliq
       in the Dockerfile and change the <prefer> family below to "Awami Nastaliq". -->
  <alias binding="strong">
    <family>Noto Nastaliq Urdu</family>
    <prefer><family>Nafees Web Naskh</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Jameel Noori Nastaleeq</family>
    <prefer><family>Nafees Web Naskh</family></prefer>
  </alias>
</fontconfig>
