name: Release

# Publish versioned container images to GHCR on each v* tag, after tests pass.
# Cut a release by tagging a tested commit:
#   git tag v1.0.0 && git push origin v1.0.0
# The facility box then rolls forward with scripts/update.sh (pull + migrate + health-gated rollback).

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coldchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coldchain_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @coldchain/db run db:generate
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/coldchain-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/coldchain-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/coldchain-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/coldchain-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
