name: Release

# Publish versioned container images to GHCR on each v* tag, after tests pass.
# Cut a release by tagging a tested commit:
#   git tag v1.0.0 && git push origin v1.0.0
# The facility box then rolls forward with update.ps1 (pull + migrate + health-gated rollback),
# run nightly by a Scheduled Task once the Promote to stable workflow moves :stable.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coldchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coldchain_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @coldchain/db run db:generate
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/coldchain-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/coldchain-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/coldchain-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/coldchain-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Boot what was just published, exactly the way a facility box boots it. The image
  # path went unexercised until v0.4.0 was verified by hand after the fact: a build that
  # succeeds proves the code compiles, not that the stack starts. This is also what
  # guards the two things that made a bad update take the store offline — `migrate`
  # being reachable from `up -d`, and `api` gating on it.
  #
  # If this job is red, DO NOT run the Promote to stable workflow. Client boxes track
  # :stable, so an unpromoted release reaches nobody.
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose an .env.production the way the installer does
        run: |
          cat > .env.production <<EOF
          POSTGRES_USER=coldchain
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          POSTGRES_DB=coldchain
          APP_DB_USER=coldchain_app
          APP_DB_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 48)
          JWT_REFRESH_SECRET=$(openssl rand -hex 48)
          PUBLIC_ORIGIN=http://localhost
          LOG_LEVEL=info
          IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          COLDCHAIN_TAG=${GITHUB_REF_NAME}
          EOF

      - name: The deploy files must be inside the image
        run: |
          # update.ps1 extracts these with `docker cp` on every client update, and
          # degrades to "keeping the current ones" if they are absent — silently. That
          # would strand every box on whatever compose file it already had.
          docker create --name bundle "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coldchain-api:${GITHUB_REF_NAME}"
          for f in docker-compose.yml Caddyfile update.ps1 scripts/app-role.sql; do
            docker cp "bundle:/app/$f" "/tmp/$(basename "$f")"
            diff -q <(tr -d '\r' < "/tmp/$(basename "$f")") <(tr -d '\r' < "$f") \
              || { echo "::error::$f in the image differs from the tagged source"; exit 1; }
            echo "  ok — $f"
          done
          docker rm -f bundle

      - name: Database first, then the app
        run: |
          set -e
          docker compose --env-file .env.production up -d postgres
          for _ in $(seq 1 40); do
            docker compose --env-file .env.production exec -T postgres pg_isready -U coldchain -d coldchain && break
            sleep 2
          done
          APP_PW=$(grep '^APP_DB_PASSWORD=' .env.production | cut -d= -f2)
          docker compose --env-file .env.production exec -T postgres \
            psql -U coldchain -d coldchain -v ON_ERROR_STOP=1 -v app_password="$APP_PW" -f - < scripts/app-role.sql
          docker compose --env-file .env.production run --rm migrate
          docker compose --env-file .env.production up -d

      - name: Health check through Caddy
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost/health || true)
            [ "$code" = "200" ] && { echo "healthy after ~$((i*3))s"; exit 0; }
            sleep 3
          done
          echo "::error::stack never became healthy"
          docker compose --env-file .env.production logs --tail=60 api
          exit 1

      # A stack that answers /health is not a stack anyone can use. v0.4.1 shipped
      # green on every check and was impossible to log into: /health needs no auth,
      # so nothing exercised the one path every client walks first. Provision a
      # facility exactly as the installer does, then log in as the owner with the
      # generated password — no X-Facility-ID header, because a fresh browser has none.
      - name: A new owner can actually log in
        run: |
          set -e
          cat > /tmp/smoke-client.json <<'JSON'
          { "facility": { "name": "Smoke Test Cold Store", "city": "Lahore" },
            "loadChartOfAccounts": true,
            "users": [ { "name": "Smoke Owner", "email": "owner@smoke.test", "role": "OWNER" } ] }
          JSON
          out=$(docker compose --env-file .env.production run --rm -T \
                  -v /tmp/smoke-client.json:/app/cfg.json:ro -e CLIENT_CONFIG=/app/cfg.json \
                  migrate pnpm --filter @coldchain/db run db:provision)
          echo "$out"
          pw=$(echo "$out" | grep -A2 'owner@smoke.test' | sed -n 's/.*password: *//p' | tr -d '\r' | head -1)
          [ -n "$pw" ] || { echo "::error::could not read the generated password from provisioning output"; exit 1; }

          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -m 20 \
                   -X POST http://localhost/v1/auth/login \
                   -H 'Content-Type: application/json' \
                   -d "{\"email\":\"owner@smoke.test\",\"password\":\"$pw\"}")
          if [ "$code" != "200" ]; then
            echo "::error::a freshly provisioned owner cannot log in (HTTP $code) — this is what a client hits on day one"
            cat /tmp/login.json
            exit 1
          fi
          grep -q access_token /tmp/login.json || { echo "::error::login returned 200 with no token"; cat /tmp/login.json; exit 1; }
          echo "  ok — new owner logged in on a fresh browser (no facility header)"

      - name: The runtime role must stay least-privilege (F-2a)
        run: |
          APP_PW=$(grep '^APP_DB_PASSWORD=' .env.production | cut -d= -f2)
          # It can read what the migrations just created…
          docker compose --env-file .env.production exec -T -e PGPASSWORD="$APP_PW" postgres \
            psql -U coldchain_app -d coldchain -tAc "select count(*) from employee_advances;" > /dev/null
          # …but must not be able to run DDL or disable the financial guards.
          if docker compose --env-file .env.production exec -T -e PGPASSWORD="$APP_PW" postgres \
               psql -U coldchain_app -d coldchain -tAc "create table must_not_exist(x int);" 2>/dev/null; then
            echo "::error::the runtime role can run DDL — F-2a hardening has regressed"; exit 1
          fi
          guards=$(docker compose --env-file .env.production exec -T postgres \
            psql -U coldchain -d coldchain -tAc "select has_function_privilege('coldchain_app','financial_guards_set(boolean)','EXECUTE');" | tr -d '[:space:]')
          [ "$guards" = "f" ] || { echo "::error::the runtime role can disable the financial guards"; exit 1; }
          echo "  ok — app role is read/write only"

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.production down -v || true
