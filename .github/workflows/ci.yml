
name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coldchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coldchain_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @coldchain/db run db:generate

      - name: Guardrail — legacy role guards removed (Phase 15)
        run: |
          if grep -rn "requireMinRole(" apps/api/src/modules; then
            echo "::error::requireMinRole( found in api modules — use app.requirePermission('<key>') instead"
            exit 1
          fi
          echo "OK: route authorization goes through the permission matrix"

      - name: Guardrail — single journal posting path (Phase 20)
        run: |
          # Every journal row must be inserted by JournalEntryService.postInTransaction,
          # which is what enforces debits==credits, the period lock and account validity.
          # A direct create bypasses all of it. Excluded: the service itself, test files,
          # and the double-guarded _test reset route.
          if grep -rn --include="*.ts" -E "journalEntry(Line)?\.(create|createMany|upsert)\(" apps/api/src \
              | grep -v "modules/accounting/journal-entry.service.ts" \
              | grep -v "\.test\.ts" \
              | grep -v "modules/_test/"; then
            echo "::error::Direct journal-entry write found — post through JournalEntryService.postInTransaction instead"
            exit 1
          fi
          echo "OK: journal rows are written only by postInTransaction"

      - name: Guardrail — advisory locks go through the helper (Phase 20)
        run: |
          # `SELECT ... WHERE pg_advisory_xact_lock(...) IS NOT NULL OR TRUE` acquires
          # nothing: PostgreSQL folds the OR TRUE and never evaluates the call. Every
          # document-number generator used that form. Route all advisory locks through
          # common/advisory-lock.ts, which uses a form that actually locks.
          if grep -rn --include="*.ts" "pg_advisory" apps/api/src \
              | grep -v "common/advisory-lock.ts" \
              | grep -v "\.test\.ts"; then
            echo "::error::Raw pg_advisory_* call found — use advisoryXactLock() from common/advisory-lock.ts"
            exit 1
          fi
          echo "OK: advisory locks go through the helper"

      - name: Typecheck
        run: pnpm typecheck

      # `next build` is the only thing that enforces the App Router's export rules —
      # plain tsc does not. A helper exported from a page.tsx kept this step red from
      # phase/22 to phase/26 while typecheck and the unit tests stayed green, and it
      # would have made the v0.4.0 release publish nothing at all.
      - name: Build
        run: pnpm build

      # Unit only: apps/api/vitest.config.ts excludes *.integration.test.ts.
      - name: Test (unit)
        run: pnpm test

      # The integration suite had never run in CI — 530 tests covering the whole
      # accounting engine gated nothing and ran on one laptop. db:deploy (not a bare
      # `migrate deploy`) so that the client update path is exercised on every run too;
      # seed.ts creates facility 00000000-…0001 with the full chart of accounts, which
      # is the TEST_FACILITY_ID the suite expects.
      - name: Apply migrations + seed
        run: |
          pnpm --filter @coldchain/db run db:deploy
          pnpm --filter @coldchain/db run db:seed

      - name: Test (integration)
        run: pnpm --filter @coldchain/api run test:integration

      # The repair path in deploy.ts only runs against a migration history that cannot
      # exist on a healthy database, so nothing else covers it. Reproduces the client's
      # wedged box, then proves the repair.
      - name: Migration-repair regression
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/verify-migration-repair.sh
